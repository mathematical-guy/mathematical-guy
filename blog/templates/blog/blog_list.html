{% extends 'blog/base.html' %}
{% load static %}

{% block title_block %}
Blogs
{% endblock %}

{% block content_block %}
  <h1 class="my-4 mx-auto w-75">Blogs</h1>

  <table class="table table-hover my-2 mx-auto w-75">
    <thead>
      <tr>
        <th scope="col">Poster Image</th>
        <th scope="col">Title</th>
        <th scope="col">Created At</th>
      </tr>
    </thead>

    <tbody>
      {% for blog in blogs %}
        <tr onclick="window.location='/blogs/{{ blog.id }}/'">
          <td class="py-5">
            <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="currentColor" class="bi bi-folder2-open" viewBox="0 0 16 16">
              <path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h2.764c.958 0 1.76.56 2.311 1.184C7.985 3.648 8.48 4 9 4h4.5A1.5 1.5 0 0 1 15 5.5v.64c.57.265.94.876.856 1.546l-.64 5.124A2.5 2.5 0 0 1 12.733 15H3.266a2.5 2.5 0 0 1-2.481-2.19l-.64-5.124A1.5 1.5 0 0 1 1 6.14zM2 6h12v-.5a.5.5 0 0 0-.5-.5H9c-.964 0-1.71-.629-2.174-1.154C6.374 3.334 5.82 3 5.264 3H2.5a.5.5 0 0 0-.5.5zm-.367 1a.5.5 0 0 0-.496.562l.64 5.124A1.5 1.5 0 0 0 3.266 14h9.468a1.5 1.5 0 0 0 1.489-1.314l.64-5.124A.5.5 0 0 0 14.367 7z" />
            </svg>
          </td>
          <td class="py-5">{{ blog.title }}</td>
          <td class="py-5">{{ blog.created_at }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
